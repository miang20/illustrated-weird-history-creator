name: Preview Scene Images

on:
  workflow_dispatch:
    inputs:
      script:
        description: Paste your full narration (scene headings are optional)
        required: true
        type: string
      niche:
        description: Visual niche preset
        required: true
        type: choice
        options: [stickman_history, survival, psychology, science, dark_mysteries]
        default: stickman_history
      provider:
        description: Image provider
        required: true
        type: choice
        options: [pollinations, local]
        default: pollinations

permissions:
  contents: read

jobs:
  preview-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Restore free scene-image cache
        uses: actions/cache@v4
        with:
          path: .image-cache/
          key: scene-image-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scene-image-cache-${{ runner.os }}-${{ github.ref_name }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free image-generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          pip install "diffusers>=0.31,<1" "transformers>=4.44,<5" "accelerate>=1.0,<2" "safetensors>=0.4,<1" "Pillow>=10.4,<13" "requests>=2.32,<3"
      - name: Generate only six scene images (no voice or video)
        env:
          MANUAL_SCRIPT: ${{ github.event.inputs.script }}
          NICHE: ${{ github.event.inputs.niche || 'stickman_history' }}
          PROVIDER: ${{ github.event.inputs.provider || 'pollinations' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.manual_script import build_manual_story
          from src.niche_presets import load_niche_preset
          from src.image_providers import validate_provider
          from src.visuals import generate_scenes

          raw = os.environ.get("MANUAL_SCRIPT", "")
          if len(raw.strip()) < 80:
              raise SystemExit("Paste the narration you want to preview (at least 80 characters).")
          niche = os.environ.get("NICHE", "stickman_history")
          provider = validate_provider(os.environ.get("PROVIDER", "pollinations"))
          preset = load_niche_preset(niche)
          story = build_manual_story("Scene Style Preview", raw)
          out = Path("scene-preview")
          scene_dir = out / "scenes"
          out.mkdir(parents=True, exist_ok=True)
          images = generate_scenes(
              "Scene Style Preview", story.paragraphs, scene_dir,
              scene_count=6, niche=niche, provider=provider, cache_dir=Path(".image-cache"),
          )
          manifest = json.loads((scene_dir / "image_manifest.json").read_text(encoding="utf-8"))
          (out / "prompts.txt").write_text((scene_dir / "prompts.txt").read_text(encoding="utf-8"), encoding="utf-8")
          report = {
              "niche": niche,
              "niche_display_name": preset["display_name"],
              "requested_provider": provider,
              "image_count": len(images),
              "fallback_count": manifest["fallback_count"],
              "images": manifest["images"],
              "voice_generated": False,
              "video_rendered": False,
              "narration_rewritten": False,
          }
          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(f"Image preview complete: {len(images)} images; provider={provider}; fallback_count={manifest['fallback_count']}. No voice or video was generated.")
          PY
      - name: Upload six scene images and prompts
        uses: actions/upload-artifact@v4
        with:
          name: scene-preview-images
          path: scene-preview/
          if-no-files-found: error
          retention-days: 7
