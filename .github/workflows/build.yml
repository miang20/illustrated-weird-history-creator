name: Build Weird History Video

on:
  push:
    branches:
      - integration-check
  workflow_dispatch:
    inputs:
      topic:
        description: Historical topic for the documentary
        required: true
        type: string
        default: The dancing plague of 1518
      duration:
        description: Narration duration in minutes (5 to 8)
        required: true
        type: string
        default: "6"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and system text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Install CPU PyTorch and neural voice/image dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-render.txt
      - name: Render complete documentary
        env:
          TOPIC: ${{ inputs.topic || 'The dancing plague of 1518' }}
          DURATION: ${{ inputs.duration || '6' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.render import render_documentary
          duration = int(os.environ["DURATION"])
          if duration < 5 or duration > 8:
              raise SystemExit("Duration must be between 5 and 8 minutes.")
          result = render_documentary(
              topic=os.environ["TOPIC"],
              duration_minutes=duration,
              scene_count=12,
              voice="af_heart",
              resolution="1280x720",
              output_dir=Path("output"),
          )
          print(result["report"])
          PY
      - name: Upload final MP4 and production notes
        uses: actions/upload-artifact@v4
        with:
          name: weird-history-mp4
          path: |
            output/**/final_weird_history.mp4
            output/**/script.txt
            output/**/sources.json
            output/**/render_report.json
            output/**/captions.srt
          if-no-files-found: error
          retention-days: 2
