name: Render Manual Stickman Documentary

on:
  workflow_dispatch:
    inputs:
      niche:
        description: Visual and caption preset
        required: true
        type: choice
        options: [stickman_history, survival, psychology, science, dark_mysteries]
        default: stickman_history
      title:
        description: Video title / output name
        required: true
        type: string
        default: "My Stickman Documentary"
      script:
        description: Paste the complete narration. Scene headings are optional and will not be spoken.
        required: true
        type: string
      duration:
        description: Target narration length in minutes
        required: true
        type: choice
        options: ["5", "6", "7", "8"]
        default: "5"
      scenes:
        description: Number of generated 2D stickman scene images
        required: true
        type: choice
        options: ["18", "24", "30", "36"]
        default: "30"
      voice:
        description: Narrator voice override (or use the selected niche preset default)
        required: true
        type: choice
        options: [preset_default, af_heart, am_michael]
        default: preset_default
      resolution:
        description: Landscape export size
        required: true
        type: choice
        options: ["1920x1080", "1280x720"]
        default: "1920x1080"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and system text dependencies
        run: sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Verify runner media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install CPU PyTorch and neural voice/image dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-render.txt
      - name: Preflight renderer imports and export settings
        env:
          NICHE: ${{ github.event.inputs.niche || 'stickman_history' }}
          DURATION: ${{ github.event.inputs.duration || '5' }}
          SCENES: ${{ github.event.inputs.scenes || '30' }}
          VOICE: ${{ github.event.inputs.voice || 'preset_default' }}
          RESOLUTION: ${{ github.event.inputs.resolution || '1920x1080' }}
        run: |
          python -m compileall -q app.py src
          python - <<'PY'
          import os
          import numpy, soundfile, torch, diffusers, transformers
          from kokoro import KPipeline
          from src.manual_script import build_manual_story
          from src.niche_presets import load_niche_preset
          from src.render import render_documentary
          niche = os.environ["NICHE"]
          preset = load_niche_preset(niche)
          duration = int(os.environ["DURATION"])
          scenes = int(os.environ["SCENES"])
          voice_input = os.environ["VOICE"]
          voice = preset["default_voice"] if voice_input == "preset_default" else voice_input
          resolution = os.environ["RESOLUTION"]
          if duration not in (5, 6, 7, 8):
              raise SystemExit("Unsupported narration duration.")
          if scenes not in (18, 24, 30, 36):
              raise SystemExit("Unsupported scene count.")
          if voice not in ("af_heart", "am_michael"):
              raise SystemExit("Unsupported narrator voice.")
          if resolution not in ("1920x1080", "1280x720"):
              raise SystemExit("Unsupported output resolution.")
          sample = build_manual_story("Preflight", "## SCENE 1 — HOOK\n" + ("This is a complete manual narration sentence. " * 60))
          if sample.word_count < 250 or any("SCENE 1" in p for p in sample.paragraphs):
              raise SystemExit("Manual-script parser preflight failed.")
          print(f"Preflight passed: niche={niche}, manual script mode, {duration} min, {scenes} scenes, {voice}, {resolution}; CPU torch={torch.__version__}.")
          PY
      - name: Render the supplied manual script
        env:
          TITLE: ${{ github.event.inputs.title }}
          MANUAL_SCRIPT: ${{ github.event.inputs.script }}
          NICHE: ${{ github.event.inputs.niche || 'stickman_history' }}
          DURATION: ${{ github.event.inputs.duration }}
          SCENES: ${{ github.event.inputs.scenes }}
          VOICE: ${{ github.event.inputs.voice }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.render import render_documentary
          title = os.environ.get("TITLE", "").strip()
          script = os.environ.get("MANUAL_SCRIPT", "").strip()
          if len(script) < 250:
              raise SystemExit("Paste the complete manual narration in the script input.")
          duration = int(os.environ["DURATION"])
          if duration not in (5, 6, 7, 8):
              raise SystemExit("Duration must be between 5 and 8 minutes.")
          print(f"Rendering manual script: {title}; words={len(script.split())}; target={duration} min.")
          result = render_documentary(
              topic=title or "Manual Script Documentary",
              duration_minutes=duration,
              scene_count=int(os.environ["SCENES"]),
              voice=os.environ["VOICE"],
              resolution=os.environ["RESOLUTION"],
              output_dir=Path("output"),
              manual_script=script,
              niche=os.environ.get("NICHE", "stickman_history"),
          )
          print(result["report"])
          PY
      - name: Upload final MP4 and production notes
        uses: actions/upload-artifact@v4
        with:
          name: weird-history-mp4
          path: |
            output/**/final_weird_history.mp4
            output/**/script.txt
            output/**/sources.json
            output/**/render_report.json
            output/**/captions.srt
          if-no-files-found: error
          retention-days: 7
