name: Build Weird History Video

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      topic:
        description: Historical topic for the documentary
        required: false
        type: string
        default: ""
      duration:
        description: Narration duration in minutes (5 to 8)
        required: true
        type: choice
        options:
          - "5"
          - "6"
          - "7"
          - "8"
        default: "5"
      scenes:
        description: Number of generated scenes
        required: true
        type: choice
        options:
          - "18"
          - "24"
          - "30"
          - "36"
        default: "30"
      voice:
        description: Neural narrator voice
        required: true
        type: choice
        options:
          - af_heart
          - am_michael
        default: af_heart
      resolution:
        description: Landscape export size
        required: true
        type: choice
        options:
          - 1920x1080
          - 1280x720
        default: 1920x1080
      angle:
        description: Optional editorial angle
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and system text dependencies
        run: sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Verify runner media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install CPU PyTorch and neural voice/image dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-render.txt
      - name: Preflight renderer imports and export settings
        env:
          DURATION: ${{ github.event.inputs.duration || '5' }}
          SCENES: ${{ github.event.inputs.scenes || '30' }}
          VOICE: ${{ github.event.inputs.voice || 'af_heart' }}
          RESOLUTION: ${{ github.event.inputs.resolution || '1920x1080' }}
        run: |
          python -m compileall -q app.py src
          python - <<'PY'
          import os
          import numpy, soundfile, torch, diffusers, transformers
          from kokoro import KPipeline
          from src.render import render_documentary
          duration = int(os.environ["DURATION"])
          scenes = int(os.environ["SCENES"])
          voice = os.environ["VOICE"]
          resolution = os.environ["RESOLUTION"]
          if duration not in (5, 6, 7, 8):
              raise SystemExit("Unsupported narration duration.")
          if scenes not in (18, 24, 30, 36):
              raise SystemExit("Unsupported scene count.")
          if voice not in ("af_heart", "am_michael"):
              raise SystemExit("Unsupported narrator voice.")
          if resolution not in ("1920x1080", "1280x720"):
              raise SystemExit("Unsupported output resolution.")
          print(f"Renderer preflight passed: {duration} min, {scenes} scenes, {voice}, {resolution}; CPU torch={torch.__version__}.")
          PY
      - name: Render complete documentary
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
          DURATION: ${{ github.event.inputs.duration || '5' }}
          SCENES: ${{ github.event.inputs.scenes || '30' }}
          VOICE: ${{ github.event.inputs.voice || 'af_heart' }}
          RESOLUTION: ${{ github.event.inputs.resolution || '1920x1080' }}
          ANGLE: ${{ github.event.inputs.angle || '' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.render import render_documentary
          duration = int(os.environ["DURATION"])
          if duration < 5 or duration > 8:
              raise SystemExit("Duration must be between 5 and 8 minutes.")
          topic = os.environ.get("TOPIC", "").strip()
          if not topic:
              from src.story import weekly_topic
              topic = weekly_topic()
          print(f"Selected documentary topic: {topic}")
          result = render_documentary(
              topic=topic,
              duration_minutes=duration,
              scene_count=int(os.environ["SCENES"]),
              voice=os.environ["VOICE"],
              resolution=os.environ["RESOLUTION"],
              angle=os.environ.get("ANGLE", ""),
              output_dir=Path("output"),
          )
          print(result["report"])
          PY
      - name: Upload final MP4 and production notes
        uses: actions/upload-artifact@v4
        with:
          name: weird-history-mp4
          path: |
            output/**/final_weird_history.mp4
            output/**/script.txt
            output/**/sources.json
            output/**/render_report.json
            output/**/captions.srt
          if-no-files-found: error
          retention-days: 7
