name: Preview Documentary Script

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Historical topic to research
        required: true
        type: string
      duration:
        description: Target narration length in minutes
        required: true
        type: choice
        options: ["5", "6", "7", "8"]
        default: "5"
      angle:
        description: Editorial angle for the story
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  script-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install script-generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" --index-url https://download.pytorch.org/whl/cpu
          pip install "requests>=2.32,<3" "transformers>=4.44,<5" "accelerate>=1.0,<2" "safetensors>=0.4,<1"
      - name: Generate and validate narration only
        env:
          TOPIC: ${{ github.event.inputs.topic || 'The Terrifying Origins of Halloween' }}
          DURATION: ${{ github.event.inputs.duration || '5' }}
          ANGLE: ${{ github.event.inputs.angle || 'Trace how ancient seasonal customs evolved into the Halloween traditions people recognize today, separating well-supported history from later legends.' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.story import build_story
          story = build_story(os.environ["TOPIC"], int(os.environ["DURATION"]), os.environ.get("ANGLE", ""))
          out = Path("script-preview")
          out.mkdir(exist_ok=True)
          (out / "script.txt").write_text("\n\n".join(story.paragraphs), encoding="utf-8")
          (out / "sources.json").write_text(json.dumps(story.sources, indent=2), encoding="utf-8")
          (out / "report.json").write_text(json.dumps({
              "matched_title": story.title,
              "word_count": story.word_count,
              "paragraph_count": len(story.paragraphs),
              "target_minutes": int(os.environ["DURATION"]),
              "quality_gate": "passed"
          }, indent=2), encoding="utf-8")
          print(f"Script quality gate passed: {story.word_count} words in {len(story.paragraphs)} paragraphs.")
          PY
      - name: Upload script for review
        uses: actions/upload-artifact@v4
        with:
          name: weird-history-script-preview
          path: script-preview/
          if-no-files-found: error
          retention-days: 7
