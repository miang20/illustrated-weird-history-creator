name: Preview Manual Script

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title / project name
        required: true
        type: string
        default: "My Stickman Documentary"
      script:
        description: Paste the complete narration; scene headings are optional
        required: true
        type: string
      duration:
        description: Target narration length in minutes
        required: true
        type: choice
        options: ["5", "6", "7", "8"]
        default: "5"

permissions:
  contents: read

jobs:
  script-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse and validate the manual narration
        env:
          TITLE: ${{ github.event.inputs.title }}
          MANUAL_SCRIPT: ${{ github.event.inputs.script }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from src.manual_script import build_manual_story, script_length_report
          title = os.environ.get("TITLE", "Manual Script Documentary")
          raw = os.environ.get("MANUAL_SCRIPT", "")
          duration = int(os.environ["DURATION"])
          story = build_manual_story(title, raw)
          length = script_length_report(story.word_count, duration)
          if not length["within_target"]:
              raise SystemExit(
                  f"Script length is {story.word_count} words (~{length['estimated_minutes']} min); "
                  f"target {duration} min expects {length['minimum_words']}-{length['maximum_words']} words. "
                  "Edit the script or select a matching duration before rendering."
              )
          out = Path("script-preview")
          out.mkdir(exist_ok=True)
          (out / "script.txt").write_text("\n\n".join(story.paragraphs), encoding="utf-8")
          (out / "report.json").write_text(json.dumps({
              "title": story.title,
              "word_count": story.word_count,
              "paragraph_count": len(story.paragraphs),
              "target_minutes": duration,
              "estimated_minutes": length["estimated_minutes"],
              "script_source": "manual",
              "rewritten": False,
              "quality_gate": "passed"
          }, indent=2), encoding="utf-8")
          print(f"Manual script quality gate passed: {story.word_count} words, {len(story.paragraphs)} speech beats, target {duration} minutes.")
          PY
      - name: Upload script preview
        uses: actions/upload-artifact@v4
        with:
          name: weird-history-script-preview
          path: script-preview/
          if-no-files-found: error
          retention-days: 7
